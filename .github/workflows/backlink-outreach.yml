# Monthly trade-association backlink outreach — ports ECF Monthly Backlink
# Outreach (trade_assoc_outreach.py).
#
# DISPATCH-ONLY: sends EXTERNAL cold emails to trade associations. No schedule
# per the "no external send without explicit yes" rule. Human triggers with
# confirm=send. Do not add `schedule:` without sign-off.
name: Backlink Outreach - Trade Assoc (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "send" to confirm sending external outreach emails'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  outreach:
    if: ${{ github.event.inputs.confirm == 'send' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests 2>/dev/null || pip install pyyaml || true
      - name: Run trade-assoc outreach (external email — manual consent given)
        env:
          ECF_SMTP_HOST: ${{ secrets.ECF_SMTP_HOST }}
          ECF_SMTP_PORT: ${{ secrets.ECF_SMTP_PORT }}
          ECF_SMTP_USER: ${{ secrets.ECF_SMTP_USER }}
          ECF_SMTP_PASS: ${{ secrets.ECF_SMTP_PASS }}
        run: cd automation && python trade_assoc_outreach.py
