name: Daily report offline tests

on:
  pull_request:
    paths:
      - "automation/ecf_daily_report.py"
      - "automation/tests/test_ecf_daily_report.py"
      - ".github/workflows/daily-report-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-auth
      - run: python -m unittest discover -s automation/tests -v
