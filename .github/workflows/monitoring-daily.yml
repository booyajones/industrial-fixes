# Daily ECF monitoring — ports ECF_SERP_Tracker, ECF_Bulletin_Monitor,
# ECF_Morning_Drafts, ECF_Daily_Briefing (--no-email) into one cloud job.
# Collectors run first, then the briefing aggregates their fresh output.
# Each step is continue-on-error so one flaky monitor doesn't sink the rest;
# all output is published as an artifact.
name: ECF Monitoring (daily)

on:
  schedule:
    - cron: "15 7 * * *"   # 07:15 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      BING_API_KEY: ${{ secrets.BING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests beautifulsoup4 lxml 2>/dev/null || pip install pyyaml || true
      - name: Write GSC service account file
        run: echo '${{ secrets.GSC_SA_JSON }}' > "$RUNNER_TEMP/gsc-sa.json"
      - name: SERP tracker
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/gsc-sa.json
        run: cd automation && python serp_tracker.py || true
      - name: Service bulletin monitor
        continue-on-error: true
        run: cd automation && python service_bulletin_monitor.py || true
      - name: Morning drafts
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/gsc-sa.json
        run: cd automation && python morning_drafts.py --top 3 || true
      - name: Daily briefing (aggregate, no email)
        continue-on-error: true
        run: cd automation && python daily_briefing.py --no-email || true
      - name: Publish monitoring output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecf-monitoring-daily
          path: |
            automation/output/**
            automation/*_2026-*.json
          if-no-files-found: ignore
          retention-days: 14
