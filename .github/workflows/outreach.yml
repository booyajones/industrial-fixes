# Backlink outreach — ports ECF-Outreach-Replies / outreach_pipeline.py.
#
# DISPATCH-ONLY BY DESIGN: this sends EXTERNAL cold emails to prospects.
# Per the operator rule "never send external email without explicit yes",
# this workflow has NO schedule — it runs only when a human manually triggers
# it (workflow_dispatch). That manual trigger is the explicit consent.
# Do NOT add a `schedule:` trigger without sign-off.
name: Backlink Outreach (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "send" to confirm you intend to send external emails'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  outreach:
    if: ${{ github.event.inputs.confirm == 'send' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests 2>/dev/null || pip install pyyaml || true
      - name: Run outreach (external email — manual consent given)
        env:
          ECF_SMTP_HOST: ${{ secrets.ECF_SMTP_HOST }}
          ECF_SMTP_PORT: ${{ secrets.ECF_SMTP_PORT }}
          ECF_SMTP_USER: ${{ secrets.ECF_SMTP_USER }}
          ECF_SMTP_PASS: ${{ secrets.ECF_SMTP_PASS }}
        run: cd automation && python outreach_pipeline.py
