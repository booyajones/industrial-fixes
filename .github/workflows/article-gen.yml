# Daily demand-driven article generation — ported from the local Windows
# ECF-Article-Generator scheduled task so it runs in the cloud (no dependency
# on the EC2 being awake). Mines GSC + Reddit gaps, researches via Perplexity,
# writes guides via Claude, wires internal links, commits + pushes. The push
# (made with CONTENT_PUSH_TOKEN, a PAT) triggers the existing
# "Deploy to Cloudflare Pages" workflow, so new articles go live automatically.
name: Article Generation (daily)

on:
  # Cron removed 2026-07-28: deliberate content-freeze during quality consolidation.
  # Manual dispatch only. Do NOT re-add a schedule without reading CLAUDE.md.
  workflow_dispatch:
    inputs:
      count:
        description: "How many articles to attempt"
        default: "30"
        required: false

concurrency:
  group: content-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (PAT so the content push triggers the deploy workflow)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CONTENT_PUSH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write GSC service account file from secret
        shell: bash
        run: |
          echo '${{ secrets.GSC_SA_JSON }}' > "$RUNNER_TEMP/gsc-sa.json"

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/gsc-sa.json
          COUNT: ${{ github.event.inputs.count || '30' }}
        run: |
          python scripts/generate-articles.py --count "$COUNT"

      - name: Commit + push new articles (triggers Cloudflare deploy)
        shell: bash
        run: |
          git config user.email "chris.a.wyatt@gmail.com"
          git config user.name "ECF Article Bot"
          git add src/data/blog scripts/.generated-articles.json scripts/.article-review-queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new articles this run."
            exit 0
          fi
          git commit -m "Demand-driven articles (GSC + Reddit gaps) [cloud]"
          for i in 1 2 3 4 5; do
            git pull --rebase --no-edit origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true
            echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
          done
          echo "push failed after retries"; exit 1

      - name: IndexNow ping (best-effort)
        continue-on-error: true
        run: node scripts/indexnow-ping.mjs
