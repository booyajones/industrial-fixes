# Continuous content deepening — regenerates EXISTING shallow consumer code
# pages to Diagnosis Command Center depth (verdict + ranked causes + decision
# tree + cost math + exact part) in the cloud, on a schedule, so the backlog of
# ~890 not-yet-deep pages keeps draining without depending on a local machine.
# Idempotent (regen-deep skips already-deep pages) and review-gated (only
# overwrites a live page when the deeper version scores >= 7, never downgrades).
# The push (CONTENT_PUSH_TOKEN PAT) triggers the Cloudflare deploy workflow.
name: Content Deepening (continuous)

on:
  schedule:
    - cron: "15 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      count:
        description: "How many pages to deepen this run"
        default: "40"
        required: false
      jobs:
        description: "Parallel workers"
        default: "2"
        required: false

concurrency:
  group: content-deepen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout (PAT so the content push triggers the deploy workflow)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CONTENT_PUSH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deepen consumer code pages (revenue-first, then backlog)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          COUNT: ${{ github.event.inputs.count || '40' }}
          JOBS: ${{ github.event.inputs.jobs || '2' }}
        run: |
          # Inputs come in via env (never interpolated into the shell) to avoid
          # Actions script injection. Revenue-first, then broaden the backlog.
          if [ -f .planning/money-targets.txt ]; then
            python scripts/money-gen.py --file .planning/money-targets.txt --jobs "$JOBS" || true
          fi
          python scripts/regen-deep.py --count "$COUNT" --jobs "$JOBS"

      - name: Commit + push deepened pages (triggers Cloudflare deploy)
        shell: bash
        run: |
          git config user.email "chris.a.wyatt@gmail.com"
          git config user.name "ECF Deepen Bot"
          git checkout -- public/search-index.json 2>/dev/null || true
          git add src/data/blog 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No pages deepened this run."
            exit 0
          fi
          git commit -m "Content deepening: consumer code pages to Command Center depth [cloud]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push race, retry $i"; sleep $((RANDOM % 8 + 3))
          done
          echo "push failed after retries"; exit 1
