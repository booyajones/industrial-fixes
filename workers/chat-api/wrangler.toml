name = "errorcodefixes-chat"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
SITE_URL = "https://errorcodefixes.com"

# Per-IP rate limit: 20 requests / 60s (IPv6 keyed on /64 in code). A real user
# won't exceed this; a single-IP bot flood will be 429'd.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# GLOBAL throughput cap: 100 OpenAI-bound requests / 60s SITE-WIDE (constant key
# in code). Bounds worst-case OpenAI spend even against a distributed / IPv6-
# rotated flood that the per-IP limit can't stop. ~100/min >> real traffic.
[[unsafe.bindings]]
name = "GLOBAL_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

# Set the OpenAI API key as a secret (never commit the real key):
#   npx wrangler secret put OPENAI_API_KEY --name errorcodefixes-chat
